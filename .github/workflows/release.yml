name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing signed tag to release, for example v1.1.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-release:
    name: Verify Signed Tag And Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify signed annotated tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          TYPE="$(git cat-file -t "refs/tags/$TAG" || true)"
          if [ "$TYPE" != "tag" ]; then
            echo "Tag $TAG must be an annotated tag."
            exit 1
          fi
          TAG_BODY="$(git cat-file -p "refs/tags/$TAG")"
          if ! echo "$TAG_BODY" | grep -Eq "BEGIN (PGP|SSH) SIGNATURE"; then
            echo "Tag $TAG is not signed. See RELEASE_POLICY.md."
            exit 1
          fi
          TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Tag $TAG must point to a commit contained in origin/main."
            exit 1
          fi

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping GitHub Release for moving tag $TAG."
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release for $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" \
            --title "Repo Task Tracker $TAG" \
            --generate-notes
